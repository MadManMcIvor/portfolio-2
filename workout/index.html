<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Workout — Alex McIvor</title>
    <meta name="description" content="A small kettlebell circuit builder and interval timer. Everything is kept in this browser." />

    <!-- Theme: light by default, applied before first paint to avoid a flash.
         Same key as the main site, so /workout honours the choice made there. -->
    <script>
      (function () {
        var KEY = 'theme';
        var DEFAULT = 'light';
        function apply(choice) {
          document.documentElement.setAttribute('data-theme', choice);
        }
        function stored() {
          try {
            var v = localStorage.getItem(KEY);
            return v === 'light' || v === 'dark' ? v : null;
          } catch (e) {
            return null;
          }
        }
        apply(stored() || DEFAULT);
        window.setTheme = function (choice) {
          apply(choice);
          try {
            localStorage.setItem(KEY, choice);
          } catch (e) {}
        };
      })();
    </script>

    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />

    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS still wants the old meta tags to install to the home screen. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f8f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="app-title">Workout</h1>

        <nav class="tabs" aria-label="Sections">
          <a href="#/calendar" data-tab="calendar">Calendar</a>
          <a href="#/builder" data-tab="builder">Circuits</a>
          <a href="#/library" data-tab="library">Library</a>
        </nav>

        <button id="theme-toggle" type="button" class="btn btn-icon" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </span>
        </button>
      </header>

      <main id="view" tabindex="-1"></main>

      <footer class="app-footer">
        <a href="/">alexmcivor.com</a>
        <a href="#/data">Your data</a>
        <span class="credit">Kept in this browser.</span>
      </footer>

      <!-- Hidden once the app is installed; see the display-mode rule in styles.css. -->
      <p class="install-hint">
        Add this to your home screen to use it offline — in Safari, Share then
        <strong>Add to Home Screen</strong>.
      </p>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
